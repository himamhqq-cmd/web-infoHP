<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Peternak</title>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">
    <h2>Terima kasih, data Anda sudah terverifikasi!</h2>
    <p>Halaman ini bisa Anda tutup sekarang.</p>

    <script>
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScTQPJ8QNDWp9WrAmUayOJGVvmT73Ea9hUTyGseBoDMfykMlw/formResponse";

        const urlParams = new URLSearchParams(window.location.search);
        const namaPeternak = urlParams.get('nama') || 'Tanpa Nama';

        const formData = new FormData();
        formData.append('entry.510105707', namaPeternak);
        formData.append('entry.909415257', navigator.userAgent);
        formData.append('entry.1426780158', window.screen.width + "x" + window.screen.height);

        fetch(FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        });
    </script>
</body>
</html>
