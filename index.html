<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Peternak</title>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">
    <h2>Terima kasih, data Anda sudah terverifikasi untuk persiapan aplikasi FLOXX by Japfa</h2>
    <p>Halaman ini bisa Anda tutup sekarang.</p>

    <script>
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScTQPJ8QNDWp9WrAmUayOJGVvmT73Ea9hUTyGseBoDMfykMlw/formResponse";

        const urlParams = new URLSearchParams(window.location.search);
        let namaPeternak = urlParams.get('nama') || 'Tanpa Nama';
        namaPeternak = namaPeternak.split(']')[0].split('(')[0].trim();

        async function kirimData() {
            let infoHP = navigator.userAgent;

            // Meminta detail model HP spesifik jika browser mendukung
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(["model", "platform", "platformVersion"]);
                    if (ua.model) {
                        infoHP = `${ua.platform} ${ua.platformVersion || ''} - Model: ${ua.model} (${navigator.userAgent})`;
                    }
                } catch (e) {}
            }

            const formData = new FormData();
            formData.append('entry.510105707', namaPeternak);
            formData.append('entry.909415257', infoHP);
            formData.append('entry.1426780158', window.screen.width + "x" + window.screen.height);

            fetch(FORM_URL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            });
        }

        kirimData();
    </script>
</body>
</html>
