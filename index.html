<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Peternak</title>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">
    <h2>Terima kasih, data Anda sudah terverifikasi!</h2>
    <p>Halaman ini bisa Anda tutup sekarang.</p>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbGwwsLR6Y8A8R3gKifmWXmL5ZxQF152RbZk1Rd6bNXj3x00L79LiFNDS_1GWq3cIa/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const namaPeternak = urlParams.get('nama') || 'Tanpa Nama';

        const formData = new FormData();
        formData.append('nama', namaPeternak);
        formData.append('userAgent', navigator.userAgent);
        formData.append('screen', window.screen.width + "x" + window.screen.height);

        fetch(SCRIPT_URL, {
            method: "POST",
            body: formData
        });
    </script>
</body>
</html>
